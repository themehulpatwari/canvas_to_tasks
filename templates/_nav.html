    <header class="site-nav">
        <div class="site-nav-inner">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                Canvas to Tasks
            </a>
            <div class="nav-right">
                {% if nav_user is defined and nav_user %}
                    {% if nav_user.userinfo and nav_user.userinfo.picture %}
                        <img class="nav-avatar" src="{{ nav_user.userinfo.picture }}" alt="">
                    {% endif %}
                    {% if nav_user.userinfo %}
                        <span class="nav-email">{{ nav_user.userinfo.email }}</span>
                    {% endif %}
                    <a class="nav-link" href="/logout">Logout</a>
                    <span class="nav-sep" aria-hidden="true"></span>
                {% endif %}
                <a class="nav-link" href="https://github.com/themehulpatwari/canvas_to_tasks" target="_blank" rel="noopener noreferrer">GitHub</a>
                <button type="button" id="theme-toggle" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode" hidden>
                    <span class="theme-switch-knob" aria-hidden="true">
                        <svg class="icon-sun" viewBox="0 0 24 24" width="10" height="10"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" width="10" height="10"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
                    </span>
                </button>
            </div>
        </div>
    </header>
